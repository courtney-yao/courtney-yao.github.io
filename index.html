<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courtney Yao | Storyboard Portfolio</title><meta name="description" content="Storyboards and concept design by Courtney Yao, an animation student at SCAD."><style>
:root{--ink:#272c2b;--muted:#737c78;--green:#4c7c69;--line:#dce2de;--paper:#fff}*{box-sizing:border-box}body{margin:0;background:white;color:var(--ink);font:16px/1.65 Arial,Helvetica,sans-serif}a{color:inherit}button{font:inherit;cursor:pointer}button:disabled{opacity:.3;cursor:default}a,button{ -webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--green);outline-offset:4px}.sidebar{position:fixed;inset:0 auto 0 0;width:242px;padding:52px 34px 28px;display:flex;flex-direction:column;border-right:1px solid #eef0ee;background:#fff;overflow-y:auto}.brand{text-decoration:none;font:30px/1.15 Georgia,serif;letter-spacing:-1px}.brand span{display:block}.chinese{font-size:14px;letter-spacing:3px;color:var(--muted);margin-top:15px}.role{font-size:14px;color:var(--green);margin:20px 0 36px}.sidebar nav{display:flex;flex-direction:column;gap:13px}.sidebar nav a{font-size:16px;text-decoration:none;display:block;padding:5px 0}.sidebar nav a.active{color:var(--green);font-weight:bold}.sidebar nav a:hover{color:var(--green)}.sidecontact{margin-top:auto;padding-top:50px;font-size:13px;color:var(--muted)}.sidecontact a{display:block;text-decoration:none;margin:6px 0}.copyright{font-size:12px;margin-top:24px;color:#969d98}main{margin-left:242px;padding:47px 52px 80px;max-width:1700px}.intro{border-bottom:1px solid var(--line);padding-bottom:32px;margin-bottom:38px}.intro h1,.projecthead h1{font:normal 44px/1.15 Georgia,serif;letter-spacing:-1px;color:var(--green);margin:0 0 25px}.intro p{margin:0;max-width:850px;color:#59625e;font-size:16px}.portfolio-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px 36px;align-items:start}.project-card{min-width:0;border-bottom:1px solid var(--line);padding-bottom:35px}.project-card h2{font:normal 26px/1.25 Georgia,serif;color:var(--green);margin:0 0 9px}.kind{font-size:13px;color:var(--muted);margin:0 0 13px}.description{font-size:15px;line-height:1.7;color:#59625e;margin:0 0 21px;max-width:700px}.related{display:flex;flex-wrap:wrap;gap:12px;margin:15px 0 0}.related a,.detail-link{font-size:14px;color:var(--green);text-underline-offset:4px}.detail-link{display:inline-block;margin-top:15px}.reader-stage{position:relative;background:#f4f5f3;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}.reader-stage img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}.reader-start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:11px 20px;background:#fffefa;border:1px solid #d5ded6;box-shadow:0 2px 18px #0001;color:var(--ink);white-space:nowrap;font-size:14px}.reader-controls{display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:10px}.reader-controls button{border:1px solid var(--line);background:white;min-width:37px;height:33px;border-radius:3px;font-size:17px}.reader-controls span{font-size:12px;color:var(--muted)}.reader-controls .expand{font-size:14px;padding:0 9px}.thumbs{display:flex;gap:7px;overflow-x:auto;padding:0 0 7px;scrollbar-width:thin;scrollbar-color:#b9c8c0 transparent}.thumbs button{flex:0 0 66px;height:44px;border:1px solid var(--line);background:#f7f8f6;padding:2px}.thumbs button.active{border:2px solid var(--green)}.thumbs img{width:100%;height:100%;object-fit:contain;display:block}.animatic-preview{display:block;position:relative;padding:12px;background:#fff;border:0;width:100%;cursor:pointer;margin-bottom:15px}.animatic-preview video{display:block;width:100%;height:auto;pointer-events:none;background:#f4f5f3}.animatic-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#0008;color:#fff;border:1px solid #fff8;border-radius:50%;width:50px;height:50px;display:grid;place-items:center;font-size:20px}.media-label{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:20px 0 9px}video{max-width:100%}.back{font-size:14px;text-underline-offset:4px;color:var(--green);display:inline-block;margin-bottom:27px}.projecthead{border-bottom:1px solid var(--line);margin-bottom:28px;display:flex;justify-content:space-between;gap:20px;align-items:start}.projecthead h1{margin-bottom:22px}.board-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 13px;margin-top:28px}.page{margin:0;min-width:0}.page img{width:100%;display:block;height:auto;cursor:zoom-in}.page figcaption{font-size:12px;color:var(--muted);padding-top:7px}.concept-images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:23px;margin-top:28px}.board-options summary{cursor:pointer;list-style:none;border:1px solid var(--line);padding:7px 12px;font-size:14px}.board-options button{display:block;background:white;border:1px solid var(--line);padding:9px;font-size:14px}.contact{display:flex;flex-direction:column;align-items:start;gap:15px;margin:35px 0}.contact a,.contact button{background:white;border:1px solid var(--line);padding:16px 22px;text-decoration:none;text-align:left;font-size:16px;min-width:300px}.contact .primary{border-color:var(--green);color:var(--green)}.contact small{display:block;color:var(--muted);font-size:13px;margin-bottom:3px}.single-video{max-width:680px;margin:30px auto}.small{font-size:13px;color:var(--muted)}dialog{border:0;background:#fff;padding:15px;max-width:96vw;max-height:96vh}dialog::backdrop{background:#000c}#zoom img{max-width:90vw;max-height:85vh;object-fit:contain;display:block}#zoom button{display:block;margin-left:auto;border:0;background:white;padding:7px 12px}#board-lightbox{width:100vw;height:100dvh;max-width:100vw;max-height:100dvh;margin:0;padding:0;background:transparent;color:white;overflow:hidden}#board-lightbox::backdrop,#video-lightbox::backdrop{background:#000e}.lightbox-stage{height:100%;display:flex;align-items:center;justify-content:center;padding:70px 75px}.lightbox-stage img{max-width:100%;max-height:100%;object-fit:contain}.lightbox-close,.lightbox-arrow,.lightbox-grid{position:absolute;background:#ffffff15;color:white;border:1px solid #ffffff40;border-radius:6px;padding:10px 16px;font:inherit}.lightbox-close{top:18px;right:22px}.lightbox-grid{top:18px;left:22px}.lightbox-arrow{top:50%;transform:translateY(-50%);font-size:26px}.lightbox-arrow.prev{left:14px}.lightbox-arrow.next{right:14px}.lightbox-count{position:absolute;bottom:22px;width:100%;text-align:center;font-size:13px;color:#ddd}body.lightbox-open{overflow:hidden}#video-lightbox{width:100vw;height:100dvh;max-width:100vw;max-height:100dvh;margin:0;padding:65px 6vw;background:transparent;overflow:hidden}.video-stage{height:100%;display:flex;align-items:center;justify-content:center}#video-lightbox video{max-width:100%;max-height:100%;width:auto;height:auto;background:black}@media(min-width:1600px){main{padding-left:65px;padding-right:65px}.portfolio-grid{gap:52px}}@media(max-width:1050px){.sidebar{width:205px;padding:40px 25px}main{margin-left:205px;padding:38px 30px}.portfolio-grid{gap:35px 23px}.project-card h2{font-size:23px}}@media(max-width:800px){.sidebar{position:static;width:auto;padding:24px;border-right:0;border-bottom:1px solid var(--line);display:block}.brand{font-size:25px}.brand span{display:inline}.brand span+span{margin-left:6px}.chinese,.role,.sidecontact,.copyright{display:none}.sidebar nav{flex-direction:row;gap:24px;flex-wrap:wrap;margin-top:20px}.sidebar nav a{font-size:14px}main{margin-left:0;padding:30px 24px 60px}.intro h1{font-size:36px}.portfolio-grid{gap:35px 24px}}@media(max-width:580px){.portfolio-grid{grid-template-columns:1fr}.intro h1{font-size:34px}.board-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.concept-images{grid-template-columns:1fr}.lightbox-stage{padding:65px 42px}.lightbox-arrow{padding:5px 10px}.lightbox-arrow.prev{left:3px}.lightbox-arrow.next{right:3px}.projecthead h1{font-size:34px}.contact a,.contact button{min-width:0;width:100%;overflow-wrap:anywhere}}
.timed-player{margin:8px 0 18px}.timed-player video{display:block;width:100%;height:auto;background:#f4f5f3;max-height:65vh}.timed-player:focus-visible{outline:2px solid var(--green);outline-offset:4px}.timed-tools{display:flex;align-items:center;gap:7px;margin-top:9px}.timed-tools button{border:1px solid var(--line);background:white;padding:4px 10px;font-size:14px;min-height:32px}.timed-tools .panel-position{font-size:12px;color:var(--muted);margin-right:auto}.keyboard-hint{font-size:12px;color:var(--muted);margin:7px 0 0}.timed-player .enlarge{font-size:13px} @font-face{font-family:PortfolioHeading;src:url('assets/fonts/heading-regular.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:PortfolioSans;src:url('assets/fonts/body-regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:PortfolioSans;src:url('assets/fonts/body-semibold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap}:root{--green:#19874d;--ink:#252b28;--muted:#6a756e}body{font-family:PortfolioSans,Arial,sans-serif;font-size:16px}.intro h1,.projecthead h1{font-family:PortfolioHeading,'Arial Narrow',sans-serif;font-size:42px;font-weight:400;line-height:1.15;letter-spacing:.2px;color:var(--green)}.project-card h2{font-family:PortfolioHeading,'Arial Narrow',sans-serif;font-size:28px;font-weight:400;letter-spacing:.15px;line-height:1.2;margin-bottom:11px}.kind{font-family:PortfolioSans,Arial,sans-serif;font-size:14px;font-weight:600;color:#39463e;line-height:1.55;margin-bottom:12px}.description,.intro p{font-size:16px;font-weight:400;line-height:1.65;color:#48564d}.sidebar nav{gap:15px}.sidebar nav a{font-family:PortfolioSans,Arial,sans-serif;font-weight:400;font-size:16px;letter-spacing:.05px;color:#35433a;padding:6px 0}.sidebar nav a.active{font-weight:600;color:var(--green)}.sidebar nav a:hover{color:var(--green)}.related a,.detail-link{font-size:14px}.sidebar .brand{font-family:Georgia,serif}.sidecontact{line-height:1.8}@media(max-width:800px){.intro h1,.projecthead h1{font-size:36px}.sidebar nav a{font-size:15px}}@media(max-width:580px){.intro h1,.projecthead h1{font-size:34px}.project-card h2{font-size:27px}} </style></head><body><aside class="sidebar"><a class="brand" href="#story"><span>Courtney</span><span>Yao</span></a><div class="chinese">姚康馨</div><nav aria-label="Portfolio categories"><a href="#story" data-category="story">Storyboard</a><a href="#concept" data-category="concept">Concept Design</a><a href="#contact" data-category="contact">Contact</a></nav><div class="sidecontact"><a href="https://www.instagram.com/court.ney_life/" target="_blank" rel="noopener noreferrer">Instagram · @court.ney_life</a><span>WeChat · Courtney512</span></div><div class="copyright">Artwork © Courtney Yao</div></aside><main id="app"></main><dialog id="zoom"><button onclick="this.parentElement.close()">Close ✕</button><img alt="Enlarged artwork"></dialog><dialog id="board-lightbox" aria-label="Storyboard large image viewer"><button class="lightbox-grid" id="lightbox-grid">▦ Grid</button><button class="lightbox-close" id="lightbox-close" aria-label="Close viewer">Close ✕</button><button class="lightbox-arrow prev" id="lightbox-prev" aria-label="Previous drawing">‹</button><div class="lightbox-stage"><img id="lightbox-image" alt="Storyboard drawing"></div><button class="lightbox-arrow next" id="lightbox-next" aria-label="Next drawing">›</button><div class="lightbox-count" id="lightbox-count" aria-live="polite"></div></dialog><dialog id="video-lightbox" aria-label="Animatic player"><button class="lightbox-close" id="video-close">Close ✕</button><div class="video-stage"><video id="expanded-video" controls playsinline preload="metadata"></video></div></dialog><script src="data.js"></script><script>
const app=document.querySelector('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const find=id=>projects.find(p=>p.id===id);
function related(p){return p.related?`<div class="related">${p.related.filter(id=>find(id)).map(id=>`<a href="#project/${id}">${esc(find(id).title)}</a>`).join('')}</div>`:''}
function contact(){return `<section class="contact" aria-label="Contact Courtney"><a class="primary" href="https://www.instagram.com/court.ney_life/" target="_blank" rel="noopener noreferrer"><small>Instagram</small>@court.ney_life</a><button class="primary" id="wechat"><small>WeChat · click to copy</small>Courtney512</button><a href="mailto:courtney5123333@gmail.com"><small>Email</small>courtney5123333@gmail.com</a></section>`}
function bindContact(){const b=document.querySelector('#wechat');if(b)b.onclick=async()=>{try{await navigator.clipboard.writeText('Courtney512');b.innerHTML='<small>WeChat · copied</small>Courtney512'}catch{b.innerHTML='<small>WeChat ID</small>Courtney512'}}}
function video(p){const src=p.animatic||p.video;if(p.generatedAnimatic)return `<div class="timed-player" data-timed-player="${p.id}" tabindex="0" aria-label="${esc(p.title)} animatic player"><video controls playsinline preload="metadata" src="${esc(src)}" poster="${esc(p.thumb||p.images[0])}" aria-label="${esc(p.title)} animatic"></video><div class="timed-tools"><span class="panel-position">1 / ${p.images.length}</span><button data-step="-1" aria-label="Previous drawing in ${esc(p.title)}">‹</button><button data-step="1" aria-label="Next drawing in ${esc(p.title)}">›</button><button class="enlarge" aria-label="Enlarge ${esc(p.title)}">Enlarge ⛶</button></div></div>`;return src?`<button class="animatic-preview" data-video="${p.id}" aria-label="Play ${esc(p.title)} animatic"><video muted playsinline preload="metadata" aria-hidden="true" src="${esc(src)}#t=0.1" ${p.thumb?`poster="${esc(p.thumb)}"`:''}></video><span class="animatic-play">▶</span></button>`:''}
function reader(p){return `<div class="reader" data-reader="${p.id}"><div class="reader-stage"><img class="reader-image" src="${esc(p.thumb||p.images[0])}" alt="${esc(p.title)} ${p.cat.includes('story')?'storyboard':'design'}"><button class="reader-start">${p.cat.includes('story')?'Read storyboard':'View designs'}</button></div><div class="reader-controls"><button class="prev" aria-label="Previous drawing in ${esc(p.title)}">‹</button><span class="reader-count">${p.images.length} ${p.images.length===1?'drawing':'drawings'}</span><div><button class="next" aria-label="Next drawing in ${esc(p.title)}">›</button> <button class="expand" aria-label="Expand ${esc(p.title)}">⛶</button></div></div><div class="thumbs" aria-label="${esc(p.title)} drawings">${p.images.map((s,i)=>`<button data-page="${i}" aria-label="${esc(p.title)} drawing ${i+1}"><img src="${esc(s)}" alt="" loading="lazy"></button>`).join('')}</div></div>`}
function seekDrawing(v,p,delta,frame=false){v.pause();const end=p.images.length*p.panelDuration;const next=frame?v.currentTime+delta/24:(Math.floor((v.currentTime+.001)/p.panelDuration)+delta)*p.panelDuration;v.currentTime=Math.max(0,Math.min(end-1/24,next))}
function handleVideoKey(e,v,p){if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();e.stopPropagation();seekDrawing(v,p,e.key==='ArrowRight'?1:-1,e.shiftKey)}
function bindMedia(){app.querySelectorAll('[data-timed-player]').forEach(el=>{const p=find(el.dataset.timedPlayer),v=el.querySelector('video');el.addEventListener('keydown',e=>handleVideoKey(e,v,p));el.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>seekDrawing(v,p,Number(b.dataset.step)));el.querySelector('.enlarge').onclick=()=>{const playing=!v.paused;v.pause();openVideo(p.animatic,p.title,v.currentTime,playing)};v.addEventListener('timeupdate',()=>{el.querySelector('.panel-position').textContent=`${Math.min(p.images.length,Math.floor((v.currentTime+.001)/p.panelDuration)+1)} / ${p.images.length}`})});app.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>{const p=find(b.dataset.video);openVideo(p.animatic||p.video,p.title)});app.querySelectorAll('[data-reader]').forEach(el=>{const p=find(el.dataset.reader);let index=0,started=false;const start=el.querySelector('.reader-start'),image=el.querySelector('.reader-image');function show(){started=true;start.hidden=true;image.src=p.images[index];image.alt=p.title+' drawing '+(index+1);el.querySelector('.reader-count').textContent=`${index+1} / ${p.images.length}`;el.querySelector('.prev').disabled=index===0;el.querySelector('.next').disabled=index===p.images.length-1;el.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',Number(b.dataset.page)===index))}start.onclick=show;image.onclick=()=>{if(!started)show();else openBoard(p,index)};el.querySelector('.prev').onclick=()=>{index=Math.max(0,index-1);show()};el.querySelector('.next').onclick=()=>{index=started?Math.min(p.images.length-1,index+1):0;show()};el.querySelector('.expand').onclick=()=>openBoard(p,started?index:Math.max(0,p.images.indexOf(p.thumb)));el.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{index=Number(b.dataset.page);show()})})}
function home(category='story'){document.querySelectorAll('.sidebar nav a').forEach(a=>a.classList.toggle('active',a.dataset.category===category));if(category==='contact'){app.innerHTML=`<section class="intro"><h1>Contact</h1><p>For portfolio reviews, creative opportunities, or a conversation about stories.</p></section>${contact()}`;bindContact();return}const story=category==='story';const list=projects.filter(p=>p.cat.includes(category));app.innerHTML=`<section class="intro"><h1>${story?'Storyboard Portfolio':'Concept Design'}</h1><p>${story?"I'm Courtney Yao, an animation student focusing on storyboarding. I love telling stories through visuals and cinematography.":'Character and environment explorations for stories, from early sketches to visual concepts.'}</p></section><div class="portfolio-grid">${list.map(p=>`<article class="project-card" id="${p.id}"><h2>${esc(p.title)}</h2><p class="kind">${esc(p.kind)}</p><p class="description">${esc(p.description)}</p>${video(p)}${p.images.length&&!p.generatedAnimatic?`${p.animatic?'<div class="media-label">Storyboards</div>':''}${reader(p)}`:''}${related(p)}${p.images.length&&!p.generatedAnimatic?`<a class="detail-link" href="#project/${p.id}">View all ${story?'drawings':'designs'}</a>`:''}</article>`).join('')}</div>`;bindMedia()}
function project(id){const p=find(id);if(!p){home();return}const story=p.cat.includes('story');document.querySelectorAll('.sidebar nav a').forEach(a=>a.classList.toggle('active',a.dataset.category===p.cat[0]));app.innerHTML=`<a class="back" href="#${story?'story':'concept'}">Back to ${story?'Storyboards':'Concept Design'}</a><div class="projecthead"><div><p class="kind">${esc(p.kind)}</p><h1>${esc(p.title)}</h1></div>${p.images.length&&!p.generatedAnimatic?'<details class="board-options"><summary>Display ▦</summary><button id="view-large">Large image</button><button id="view-grid">Grid view</button></details>':''}</div><p class="description">${esc(p.description)}</p>${related(p)}${p.animatic||p.video?`<div class="single-video"><div class="media-label">Animatic</div>${video(p)}</div>`:''}<div class="${story?'board-grid':'concept-images'}">${(p.generatedAnimatic?[]:p.images).map((s,i)=>`<figure class="page"><img data-index="${i}" src="${esc(s)}" alt="${esc(p.title)} — image ${i+1}" loading="lazy"><figcaption>${i+1} / ${p.images.length}</figcaption></figure>`).join('')}</div>`;bindMedia();if(p.images.length&&!p.generatedAnimatic){document.querySelector('#view-large').onclick=()=>{app.querySelector('.board-options').open=false;openBoard(p,0)};document.querySelector('#view-grid').onclick=()=>{app.querySelector('.board-options').open=false};app.querySelectorAll('.page img').forEach(im=>im.onclick=()=>openBoard(p,Number(im.dataset.index)))}}
let lightboxProject=null, lightboxIndex=0, wheelAt=0;
const boardBox=document.querySelector('#board-lightbox');
function updateBoard(){const p=lightboxProject;if(!p)return;document.querySelector('#lightbox-image').src=p.images[lightboxIndex];document.querySelector('#lightbox-image').alt=p.title+' — drawing '+(lightboxIndex+1);document.querySelector('#lightbox-count').textContent=`${lightboxIndex+1} / ${p.images.length} · ${p.title}`;document.querySelector('#lightbox-prev').disabled=lightboxIndex===0;document.querySelector('#lightbox-next').disabled=lightboxIndex===p.images.length-1}
function openBoard(p,index){lightboxProject=p;lightboxIndex=index;updateBoard();boardBox.showModal();document.body.classList.add('lightbox-open')}
function stepBoard(delta){lightboxIndex=Math.max(0,Math.min(lightboxProject.images.length-1,lightboxIndex+delta));updateBoard()}
function closeBoard(){boardBox.close()}
document.querySelector('#lightbox-close').onclick=closeBoard;document.querySelector('#lightbox-grid').onclick=closeBoard;document.querySelector('#lightbox-prev').onclick=()=>stepBoard(-1);document.querySelector('#lightbox-next').onclick=()=>stepBoard(1);
boardBox.addEventListener('close',()=>document.body.classList.remove('lightbox-open'));
boardBox.addEventListener('wheel',e=>{e.preventDefault();const now=Date.now();if(Math.abs(e.deltaY)<3||now-wheelAt<250)return;wheelAt=now;stepBoard(e.deltaY>0?1:-1)},{passive:false});
boardBox.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();stepBoard(1)}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();stepBoard(-1)}});
const videoBox=document.querySelector('#video-lightbox'),expandedVideo=document.querySelector('#expanded-video');
function openVideo(src,title,start=0,play=true){expandedVideo.src=src;expandedVideo.setAttribute('aria-label',title+' animatic');expandedVideo.onloadedmetadata=()=>{expandedVideo.currentTime=start;if(play)expandedVideo.play().catch(()=>{})};videoBox.showModal();document.body.classList.add('lightbox-open')}
videoBox.addEventListener('keydown',e=>{const p=projects.find(p=>p.generatedAnimatic&&p.animatic===expandedVideo.getAttribute('src'));if(p)handleVideoKey(e,expandedVideo,p)});
document.querySelector('#video-close').onclick=()=>videoBox.close();videoBox.addEventListener('close',()=>{expandedVideo.pause();expandedVideo.removeAttribute('src');expandedVideo.load();document.body.classList.remove('lightbox-open')});videoBox.addEventListener('click',e=>{if(e.target===videoBox)videoBox.close()});
function route(){if(location.hash.startsWith('#project/'))project(location.hash.slice(9));else home(location.hash==='#concept'?'concept':location.hash==='#contact'?'contact':'story');window.scrollTo(0,0)}window.addEventListener('hashchange',route);document.querySelector('#zoom').addEventListener('click',e=>{if(e.target.tagName==='DIALOG')e.target.close()});route();</script></body></html>
